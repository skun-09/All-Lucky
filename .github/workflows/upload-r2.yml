name: Sync GitHub to R2

on:
  push:
    branches:
      - main

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Check Cloudflare Token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "API TOKEN が渡されていません"
            exit 1
          else
            echo "API TOKEN は渡されています"
          fi

      - name: Sync changed files to R2
        run: |
          git diff --name-status HEAD~1 HEAD > changes.txt

          echo "=== Changes ==="
          cat changes.txt

          while IFS=$'\t' read -r status path; do

            # 削除
            if [ "$status" = "D" ]; then
              echo "Deleting: $path"

              wrangler r2 object delete "all-lucky/$path" \
                --remote

            # 追加・変更
            elif [ "$status" = "A" ] || [ "$status" = "M" ]; then
              echo "Uploading: $path"

              if [ -f "$path" ]; then
                wrangler r2 object put "all-lucky/$path" \
                  --file="$path" \
                  --remote
              fi

            fi

          done < changes.txt

      - name: Sync completed
        run: |
          echo "================================"
          echo "GitHub → R2 差分同期完了"
          echo "================================"
