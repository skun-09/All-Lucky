name: Deploy Unity WebGL to R2

on:
  push:
    branches:
      - main

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Check Cloudflare Token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "API TOKEN が渡されていません"
            exit 1
          else
            echo "API TOKEN は渡されています"
          fi

      - name: Check files
        run: |
          echo "=== All-Lucky files ==="
          find games/all-lucky -type f -print

      - name: Upload index.html to R2
        run: |
          wrangler r2 object put all-lucky/index.html \
            --file=games/all-lucky/index.html \
            --remote \
            --content-type=text/html

      - name: Upload Build to R2
        run: |
          find games/all-lucky/Build -type f | while read file; do
            key="${file#games/all-lucky/}"
            wrangler r2 object put "all-lucky/$key" \
              --file="$file" \
              --remote
          done

      - name: Upload TemplateData to R2
        run: |
          find games/all-lucky/TemplateData -type f | while read file; do
            key="${file#games/all-lucky/}"
            wrangler r2 object put "all-lucky/$key" \
              --file="$file" \
              --remote
          done
