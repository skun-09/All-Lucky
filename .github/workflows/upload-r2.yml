name: Deploy Unity WebGL to R2

on:
  push:
    branches:
      - main
    paths:
      - 'Build/**'
      - 'TemplateData/**'
      - 'index.html'
      - 'worker.js'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-r2.yml'

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Check Cloudflare Token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "API TOKEN が渡されていません"
            exit 1
          else
            echo "API TOKEN は渡されています"
          fi

      - name: Upload index.html to R2
        run: |
          wrangler r2 object put all-lucky/index.html \
            --file=index.html \
            --remote \
            --content-type=text/html

      - name: Upload Build to R2
        run: |
          find Build -type f | while read file; do
            key="${file#Build/}"
            wrangler r2 object put "all-lucky/Build/$key" \
              --file="$file" \
              --remote
          done

      - name: Upload TemplateData to R2
        run: |
          find TemplateData -type f | while read file; do
            key="${file#TemplateData/}"
            wrangler r2 object put "all-lucky/TemplateData/$key" \
              --file="$file" \
              --remote
          done
