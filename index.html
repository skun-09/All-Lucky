<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>運が全て。</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;

      font-family:
        Arial,
        "Yu Gothic",
        "Meiryo",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #eef3ff,
          #cbd7f5,
          #aebee8
        );

      color: #202a4b;
    }

    /* =========================
       全体
       ========================= */

    #page {
      width: 100%;
      min-height: 100vh;

      padding: 45px 20px 40px;

      text-align: center;
    }

    /* =========================
       タイトル
       ========================= */

    #page-title {
      margin: 0;

      font-size: 48px;
      font-weight: 800;

      letter-spacing: 8px;

      color: #17203d;

      text-shadow:
        0 3px 12px
        rgba(255, 255, 255, 0.8);
    }

    #page-subtitle {
      margin-top: 8px;
      margin-bottom: 30px;

      font-size: 12px;

      letter-spacing: 5px;

      color:
        rgba(32, 42, 75, 0.55);
    }

    /* =========================
       ゲーム枠
       ========================= */

    #game-frame {
      display: inline-block;

      padding: 12px;

      background:
        rgba(255, 255, 255, 0.8);

      border:
        1px solid
        rgba(255, 255, 255, 0.95);

      border-radius: 22px;

      box-shadow:
        0 25px 60px
        rgba(50, 65, 120, 0.25);

      line-height: 0;
    }

    /* =========================
       Unity
       ========================= */

    #unity-container {
      position: relative;

      width: 960px;
      height: 540px;

      overflow: hidden;

      border-radius: 12px;

      background: #111;
    }

    #unity-canvas {
      display: block;

      width: 960px;
      height: 540px;

      margin: 0;
      padding: 0;

      border: 0;

      border-radius: 12px;
    }

    /* =========================
       ローディング
       ========================= */

    #unity-loading-bar {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 360px;

      transform:
        translate(-50%, -50%);

      padding: 28px;

      background:
        rgba(25, 32, 58, 0.92);

      border-radius: 18px;

      box-shadow:
        0 20px 50px
        rgba(0, 0, 0, 0.35);

      z-index: 100;

      text-align: center;

      line-height: normal;
    }

    #unity-loading-bar::before {
      content: "運が全て。";

      display: block;

      margin-bottom: 8px;

      color: white;

      font-size: 28px;
      font-weight: bold;

      letter-spacing: 4px;
    }

    #unity-loading-bar::after {
      content: "LOADING";

      display: block;

      margin-bottom: 18px;

      color:
        rgba(255, 255, 255, 0.55);

      font-size: 10px;

      letter-spacing: 5px;
    }

    #unity-logo {
      display: none;
    }

    #unity-progress-bar-empty {
      width: 100%;
      height: 9px;

      padding: 2px;

      background:
        rgba(255, 255, 255, 0.15);

      border-radius: 20px;

      overflow: hidden;
    }

    #unity-progress-bar-full {
      width: 0%;

      height: 100%;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          #c8d4ff
        );

      border-radius: 20px;

      box-shadow:
        0 0 12px
        rgba(220, 230, 255, 0.8);

      transition:
        width 0.12s linear;
    }

    /* =========================
       Unity警告
       ========================= */

    #unity-warning {
      position: absolute;

      left: 0;
      top: 0;

      width: 100%;

      z-index: 200;

      line-height: normal;
    }

    /* =========================
       フッター
       ========================= */

    #unity-footer {
      position: absolute;

      left: 0;
      bottom: 0;

      width: 100%;
      height: 45px;

      z-index: 50;

      pointer-events: none;
    }

    #unity-logo-title-footer,
    #unity-build-title {
      display: none;
    }

    #unity-fullscreen-button {
      position: absolute;

      right: 12px;
      bottom: 10px;

      width: 38px;
      height: 38px;

      border-radius: 10px;

      background:
        rgba(0, 0, 0, 0.55);

      cursor: pointer;

      pointer-events: auto;

      line-height: normal;
    }

    #unity-fullscreen-button::after {
      content: "⛶";

      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      color: white;

      font-size: 22px;
    }

    /* =========================
       説明
       ========================= */

    #description {
      width: min(760px, 90vw);

      margin: 28px auto 0;

      padding: 20px 25px;

      background:
        rgba(255, 255, 255, 0.5);

      border:
        1px solid
        rgba(255, 255, 255, 0.7);

      border-radius: 16px;

      box-shadow:
        0 10px 30px
        rgba(50, 65, 120, 0.12);

      color:
        rgba(32, 42, 75, 0.75);

      font-size: 14px;

      line-height: 1.8;
    }

    /* =========================
       小さい画面
       ========================= */

    @media (max-width: 1000px) {

      #page-title {
        font-size: 38px;
      }

      #game-frame {
        width: 94vw;
        padding: 8px;
      }

      #unity-container {
        width: 100%;
        height: auto;

        aspect-ratio: 16 / 9;
      }

      #unity-canvas {
        width: 100%;
        height: 100%;
      }
    }

    @media (max-width: 500px) {

      #page {
        padding-top: 25px;
      }

      #page-title {
        font-size: 30px;
        letter-spacing: 5px;
      }

      #page-subtitle {
        letter-spacing: 2px;
      }

      #unity-loading-bar {
        width: 75%;
        padding: 20px;
      }

      #unity-loading-bar::before {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div id="page">

    <!-- タイトル -->

    <h1 id="page-title">
      運が全て。
    </h1>

    <div id="page-subtitle">
      EVERYTHING DEPENDS ON LUCK.
    </div>


    <!-- ゲーム -->

    <div id="game-frame">

      <div
        id="unity-container"
        class="unity-desktop">

        <canvas
          id="unity-canvas"
          width="960"
          height="540"
          tabindex="-1">
        </canvas>


        <!-- ローディング -->

        <div id="unity-loading-bar">

          <div id="unity-logo"></div>

          <div id="unity-progress-bar-empty">

            <div
              id="unity-progress-bar-full">
            </div>

          </div>

        </div>


        <!-- 警告 -->

        <div id="unity-warning"></div>


        <!-- フッター -->

        <div id="unity-footer">

          <div id="unity-logo-title-footer"></div>

          <div id="unity-fullscreen-button"></div>

          <div id="unity-build-title">
            運が全て。
          </div>

        </div>

      </div>

    </div>


    <!-- 説明 -->

    <div id="description">

      🎲 運だけで勝負しよう。<br>

      「運が全て。」は、
      運が勝敗を左右するミニゲームです。

    </div>

  </div>


  <!-- =========================
       Unity起動プログラム
       ========================= -->

  <script>

    var canvas =
      document.querySelector(
        "#unity-canvas"
      );


    function unityShowBanner(
      msg,
      type
    ) {

      var warningBanner =
        document.querySelector(
          "#unity-warning"
        );


      var div =
        document.createElement(
          "div"
        );


      div.innerHTML = msg;


      warningBanner.appendChild(
        div
      );


      if (type == "error") {

        div.style =
          "background:red;padding:10px;";

      }

    }


    /* =========================
       Unity Build
       ========================= */

    var buildUrl =
      "Build";


    var loaderUrl =
      buildUrl +
      "/ビルド.loader.js";


    var config = {

      dataUrl:
        buildUrl +
        "/ビルド.data",

      frameworkUrl:
        buildUrl +
        "/ビルド.framework.js",

      codeUrl:
        buildUrl +
        "/ビルド.wasm",

      streamingAssetsUrl:
        "StreamingAssets",

      companyName:
        "DefaultCompany",

      productName:
        "運が全て。",

      productVersion:
        "1.0",

      showBanner:
        unityShowBanner

    };


    /* =========================
       ローディング要素
       ========================= */

    var loadingBar =
      document.querySelector(
        "#unity-loading-bar"
      );


    var progressBar =
      document.querySelector(
        "#unity-progress-bar-full"
      );


    loadingBar.style.display =
      "block";


    progressBar.style.width =
      "0%";


    /* =========================
       Unity Loader
       ========================= */

    var script =
      document.createElement(
        "script"
      );


    script.src =
      loaderUrl;


    script.onload =
      function () {


        createUnityInstance(

          canvas,

          config,

          function (progress) {

            progressBar.style.width =
              (progress * 100) + "%";

          }

        )

        .then(
          function (unityInstance) {


            /*
             * Unity起動完了
             */

            progressBar.style.width =
              "100%";


            setTimeout(
              function () {

                loadingBar.style.display =
                  "none";

              },
              200
            );


            /*
             * フルスクリーン
             */

            document.querySelector(
              "#unity-fullscreen-button"
            ).onclick =
              function () {

                unityInstance.SetFullscreen(
                  1
                );

              };

          }
        )

        .catch(
          function (message) {

            console.error(
              message
            );

            alert(
              message
            );

          }
        );

      };


    script.onerror =
      function () {

        alert(
          "Unity Loaderを読み込めませんでした。"
        );

      };


    document.body.appendChild(
      script
    );

  </script>

</body>
</html>
