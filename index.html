<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>運が全て。</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #b8c8f0;
      font-family: Arial, "Yu Gothic", "Meiryo", sans-serif;
      text-align: center;
    }

    #page {
      width: 100%;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    #page-title {
      margin: 0 0 10px;
      font-size: 44px;
      color: #182142;
    }

    #game-frame {
      display: inline-block;
      padding: 10px;
      margin-top: 20px;

      background: white;
      border-radius: 16px;

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.25);
    }

    #unity-container {
      position: relative;

      width: 960px;
      height: 540px;

      overflow: hidden;
      border-radius: 10px;

      background: black;
    }

    #unity-canvas {
      display: block;

      width: 960px;
      height: 540px;
    }

    #unity-loading-bar {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      width: 320px;

      padding: 25px;

      background: rgba(20, 25, 45, 0.9);

      border-radius: 15px;

      box-sizing: border-box;

      z-index: 10;
    }

    #unity-loading-bar::before {
      content: "運が全て。";

      display: block;

      color: white;

      font-size: 28px;

      font-weight: bold;

      margin-bottom: 18px;
    }

    #unity-progress-bar-empty {
      width: 100%;
      height: 8px;

      background: rgba(255, 255, 255, 0.2);

      border-radius: 20px;

      overflow: hidden;
    }

    #unity-progress-bar-full {
      width: 0%;
      height: 100%;

      background: white;

      border-radius: 20px;

      transition: width 0.1s linear;
    }

    #unity-logo {
      display: none;
    }

    #unity-warning {
      position: absolute;

      left: 0;
      top: 0;

      width: 100%;

      z-index: 20;
    }

    #unity-footer {
      position: absolute;

      left: 0;
      bottom: 0;

      width: 100%;
      height: 40px;

      pointer-events: none;
    }

    #unity-fullscreen-button {
      position: absolute;

      right: 10px;
      bottom: 10px;

      width: 36px;
      height: 36px;

      pointer-events: auto;

      cursor: pointer;

      background: rgba(0, 0, 0, 0.5);

      border-radius: 8px;
    }

    #unity-build-title,
    #unity-logo-title-footer {
      display: none;
    }

    #description {
      margin: 25px auto;

      max-width: 700px;

      color: #202a4b;

      line-height: 1.8;
    }

    @media (max-width: 1000px) {

      #unity-container {
        width: 90vw;
        height: calc(90vw * 0.5625);
      }

      #unity-canvas {
        width: 100%;
        height: 100%;
      }

    }
  </style>
</head>

<body>

  <div id="page">

    <h1 id="page-title">
      運が全て。
    </h1>

    <div id="game-frame">

      <div
        id="unity-container"
        class="unity-desktop">

        <canvas
          id="unity-canvas"
          width="960"
          height="540"
          tabindex="-1">
        </canvas>

        <div id="unity-loading-bar">

          <div id="unity-logo"></div>

          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>

        </div>

        <div id="unity-warning"></div>

        <div id="unity-footer">

          <div id="unity-logo-title-footer"></div>

          <div id="unity-fullscreen-button"></div>

          <div id="unity-build-title">
            運が全て。
          </div>

        </div>

      </div>

    </div>

    <div id="description">
      🎲 運だけで勝負しよう。<br>
      「運が全て。」は、運が勝敗を左右するミニゲームです。
    </div>

  </div>


  <script>

    var canvas =
      document.querySelector(
        "#unity-canvas"
      );


    function unityShowBanner(
      msg,
      type
    ) {

      var warningBanner =
        document.querySelector(
          "#unity-warning"
        );

      var div =
        document.createElement(
          "div"
        );

      div.innerHTML = msg;

      warningBanner.appendChild(div);

      if (type == "error") {

        div.style =
          "background:red;padding:10px;";

      }

    }


    var buildUrl = "Build";


    var loaderUrl =
      buildUrl +
      "/ビルド.loader.js";


    var config = {

      dataUrl:
        buildUrl +
        "/ビルド.data",

      frameworkUrl:
        buildUrl +
        "/ビルド.framework.js",

      codeUrl:
        buildUrl +
        "/ビルド.wasm",

      streamingAssetsUrl:
        "StreamingAssets",

      companyName:
        "DefaultCompany",

      productName:
        "運が全て。",

      productVersion:
        "1.0",

      showBanner:
        unityShowBanner

    };


    var loadingBar =
      document.querySelector(
        "#unity-loading-bar"
      );


    var progressBar =
      document.querySelector(
        "#unity-progress-bar-full"
      );


    loadingBar.style.display =
      "block";


    var script =
      document.createElement(
        "script"
      );


    script.src =
      loaderUrl;


    script.onload = function () {

      console.log(
        "Unity Loader loaded"
      );


      createUnityInstance(
        canvas,
        config,

        function (progress) {

          console.log(
            "Unity loading:",
            progress
          );

          progressBar.style.width =
            (progress * 100) + "%";

        }

      )
      .then(
        function (unityInstance) {

          console.log(
            "Unity started"
          );

          loadingBar.style.display =
            "none";


          document.querySelector(
            "#unity-fullscreen-button"
          ).onclick =
            function () {

              unityInstance.SetFullscreen(
                1
              );

            };

        }
      )
      .catch(
        function (message) {

          console.error(
            message
          );

          alert(message);

        }
      );

    };


    script.onerror = function () {

      alert(
        "Unity Loaderを読み込めませんでした。"
      );

    };


    document.body.appendChild(
      script
    );

  </script>

</body>
</html>
