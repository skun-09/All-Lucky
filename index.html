<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Unity Web Player | 運が全て。</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">

  <style>
    #unity-container {
      position: relative;
      margin: 0 auto;
    }

    #unity-loading-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 360px;
      text-align: center;
      z-index: 10;
    }

    #unity-loading-bar::before {
      content: "運が全て。";
      display: block;
      margin-bottom: 20px;
      color: white;
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    #unity-logo {
      display: none;
    }

    #unity-progress-bar-empty {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 10px;
      overflow: hidden;
    }

    #unity-progress-bar-full {
      height: 100%;
      background: white;
      border-radius: 10px;
      transition: width 0.15s ease;
    }

    #unity-footer {
      display: none;
    }

    #unity-logo-title-footer {
      display: none;
    }

    #unity-build-title {
      display: none;
    }
  </style>
</head>

<body>
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>

    <div id="unity-loading-bar">
      <div id="unity-logo"></div>

      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">運が全て。</div>
    </div>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");

    function unityShowBanner(msg, type) {
      var warningBanner = document.querySelector("#unity-warning");

      function updateBannerVisibility() {
        warningBanner.style.display =
          warningBanner.children.length ? "block" : "none";
      }

      var div = document.createElement("div");
      div.innerHTML = msg;
      warningBanner.appendChild(div);

      if (type == "error") {
        div.style = "background: red; padding: 10px;";
      } else {
        if (type == "warning") {
          div.style = "background: yellow; padding: 10px;";
        }

        setTimeout(function () {
          warningBanner.removeChild(div);
          updateBannerVisibility();
        }, 5000);
      }

      updateBannerVisibility();
    }

    var buildUrl = "Build";

    var loaderUrl =
      buildUrl + "/ビルド.loader.js";

    var config = {
      arguments: [],
      dataUrl: buildUrl + "/ビルド.data",
      frameworkUrl: buildUrl + "/ビルド.framework.js",
      codeUrl: buildUrl + "/ビルド.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "運が全て。",
      productVersion: "1.0",
      showBanner: unityShowBanner
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement("meta");

      meta.name = "viewport";
      meta.content =
        "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";

      document
        .getElementsByTagName("head")[0]
        .appendChild(meta);

      document.querySelector("#unity-container").className =
        "unity-mobile";

      canvas.className = "unity-mobile";
    } else {
      canvas.style.width = "960px";
      canvas.style.height = "600px";
    }

    document.querySelector("#unity-loading-bar").style.display =
      "block";

    var script = document.createElement("script");

    script.src = loaderUrl;

    script.onload = () => {
      createUnityInstance(
        canvas,
        config,
        (progress) => {
          document.querySelector(
            "#unity-progress-bar-full"
          ).style.width =
            100 * progress + "%";
        }
      )
        .then((unityInstance) => {
          document.querySelector(
            "#unity-loading-bar"
          ).style.display = "none";

          document.querySelector(
            "#unity-fullscreen-button"
          ).onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        })
        .catch((message) => {
          alert(message);
        });
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
