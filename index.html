<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="utf-8">

  <title>運が全て。｜無料で遊べる運試しゲーム</title>

  <meta
    name="description"
    content="数字を選んで運試し！すべてを決めるのは、あなたの運だけ。無料で遊べるシンプルな運試しゲーム「運が全て。」"
  >

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link
    rel="shortcut icon"
    href="TemplateData/favicon.ico"
  >


  <style>

    /* =========================
       全体
       ========================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {

      background:
        linear-gradient(
          135deg,
          #f5f8ff,
          #e8efff
        );

      color: #222;

      font-family:
        "Yu Gothic",
        "YuGothic",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;

    }


    /* =========================
       タイトル
       ========================= */

    .site-header {

      width: 100%;

      padding:
        45px 20px 35px;

      text-align: center;

      background:
        linear-gradient(
          135deg,
          #526aa5,
          #7892d0
        );

      color: white;

      box-shadow:
        0 5px 20px
        rgba(50, 70, 120, 0.18);

    }

    .site-header h1 {

      margin: 0;

      font-size: 52px;

      letter-spacing:
        0.12em;

    }

    .site-header p {

      margin:
        12px 0 0;

      font-size: 18px;

      opacity: 0.9;

    }


    /* =========================
       ゲームエリア
       ========================= */

    .game-area {

      width: 100%;

      padding:
        60px 20px;

      display: flex;

      justify-content: center;

      align-items: center;

      background:
        #e9effb;

    }


    /* =========================
       ゲーム枠
       ========================= */

    #unity-container {

      position: relative;

      display: block;

      width: 960px;

      height: 540px;

      margin: 0 auto;

      background: #111;

      border:
        7px solid white;

      border-radius:
        20px;

      overflow: hidden;

      box-shadow:
        0 20px 50px
        rgba(40, 60, 110, 0.30);

    }


    /* =========================
       Unity Canvas
       ========================= */

    #unity-canvas {

      position: absolute;

      display: block;

      left: 0;

      top: 0;

      width: 100%;

      height: 100%;

      margin: 0;

      padding: 0;

      border: 0;

      background: #000;

    }


    /* =========================
       ローディング
       ========================= */

    #unity-loading-bar {

      position: absolute;

      z-index: 1000;

      left: 50%;

      top: 50%;

      transform:
        translate(-50%, -50%);

      width: 360px;

      padding: 30px;

      background:
        rgba(30, 40, 70, 0.96);

      border-radius:
        18px;

      text-align: center;

      box-shadow:
        0 15px 40px
        rgba(0, 0, 0, 0.35);

    }


    #unity-loading-title {

      color: white;

      font-size: 28px;

      font-weight: bold;

      letter-spacing:
        0.12em;

      margin-bottom:
        8px;

    }


    #unity-loading-percent {

      color:
        rgba(255,255,255,0.8);

      font-size: 16px;

      margin-bottom:
        15px;

    }


    #unity-progress-bar-empty {

      width: 100%;

      height: 12px;

      background:
        rgba(255,255,255,0.2);

      border-radius:
        20px;

      overflow: hidden;

    }


    #unity-progress-bar-full {

      width: 0%;

      height: 100%;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          #b9ccff
        );

      border-radius:
        20px;

      transition:
        width 0.1s linear;

    }


    /* =========================
       警告
       ========================= */

    #unity-warning {

      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      z-index: 2000;

    }


    /* =========================
       フルスクリーン
       ========================= */

    #unity-fullscreen-button {

      position: absolute;

      right: 12px;

      bottom: 12px;

      z-index: 500;

      width: 40px;

      height: 40px;

      border-radius:
        10px;

      background:
        rgba(0,0,0,0.55);

      cursor: pointer;

      color: white;

      font-size: 24px;

      text-align: center;

      line-height: 40px;

      user-select: none;

    }


    #unity-fullscreen-button::after {

      content: "⛶";

    }


    /* =========================
       説明
       ========================= */

    .game-description {

      width:
        min(
          900px,
          calc(100% - 40px)
        );

      margin:
        50px auto;

      padding:
        40px;

      background:
        white;

      border-radius:
        20px;

      text-align:
        center;

      box-shadow:
        0 10px 35px
        rgba(0,0,0,0.10);

    }


    .game-description h2 {

      margin:
        0 0 25px;

      font-size:
        32px;

      color:
        #435a92;

    }


    .game-description p {

      margin:
        18px 0;

      font-size:
        18px;

      line-height:
        2;

    }


    .game-description h3 {

      margin:
        35px 0 0;

      font-size:
        24px;

      color:
        #526aa5;

    }


    /* =========================
       画面が小さい場合
       ========================= */

    @media screen and (max-width: 1000px) {

      #unity-container {

        width: 94vw;

        height: calc(94vw * 9 / 16);

      }

    }


    @media screen and (max-width: 700px) {

      .site-header {

        padding:
          35px 15px 28px;

      }

      .site-header h1 {

        font-size:
          38px;

      }

      .site-header p {

        font-size:
          15px;

      }

      .game-area {

        padding:
          30px 0;

      }

      #unity-loading-bar {

        width:
          70%;

        padding:
          20px;

      }

      #unity-loading-title {

        font-size:
          22px;

      }

      .game-description {

        width:
          calc(100% - 24px);

        margin:
          30px auto;

        padding:
          28px 20px;

      }

      .game-description h2 {

        font-size:
          27px;

      }

      .game-description p {

        font-size:
          16px;

      }

      .game-description h3 {

        font-size:
          20px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================
       タイトル
       ========================= -->

  <header class="site-header">

    <h1>
      運が全て。
    </h1>

    <p>
      すべてを決めるのは、あなたの運。
    </p>

  </header>


  <!-- =========================
       Unityゲーム
       ========================= -->

  <main class="game-area">


    <div
      id="unity-container">


      <canvas
        id="unity-canvas"
        width="960"
        height="540"
        tabindex="-1">
      </canvas>


      <!-- ローディング -->

      <div
        id="unity-loading-bar">

        <div
          id="unity-loading-title">

          運が全て。

        </div>


        <div
          id="unity-loading-percent">

          0%

        </div>


        <div
          id="unity-progress-bar-empty">

          <div
            id="unity-progress-bar-full">
          </div>

        </div>

      </div>


      <!-- Unity警告 -->

      <div
        id="unity-warning">
      </div>


      <!-- フルスクリーン -->

      <div
        id="unity-fullscreen-button">
      </div>


    </div>


  </main>


  <!-- =========================
       説明
       ========================= -->

  <section
    class="game-description">


    <h2>
      運が全て。とは？
    </h2>


    <p>
      数字を選んで、運試しに挑戦！
    </p>


    <p>
      成功するか、失敗するか。<br>
      すべてを決めるのは、あなたの「運」だけ。
    </p>


    <p>
      シンプルだけど、つい何度も遊びたくなる<br>
      運試しゲームです。
    </p>


    <h3>
      あなたは、どこまで幸運をつかめる？
    </h3>


  </section>


  <!-- =========================
       Unity起動プログラム
       ========================= -->

  <script>


    var canvas =
      document.querySelector(
        "#unity-canvas"
      );


    /* =========================
       Unity警告
       ========================= */

    function unityShowBanner(
      msg,
      type
    ) {


      var warningBanner =
        document.querySelector(
          "#unity-warning"
        );


      var div =
        document.createElement(
          "div"
        );


      div.innerHTML =
        msg;


      warningBanner.appendChild(
        div
      );


      if (
        type === "error"
      ) {

        div.style =
          "background:red;color:white;padding:10px;";

      }

      else if (
        type === "warning"
      ) {

        div.style =
          "background:yellow;color:black;padding:10px;";

      }

    }


    /* =========================
       Unityビルド
       ========================= */

    var buildUrl =
      "Build";


    var loaderUrl =
      buildUrl +
      "/ビルド.loader.js";


    var config = {

      arguments: [],

      dataUrl:
        buildUrl +
        "/ビルド.data",

      frameworkUrl:
        buildUrl +
        "/ビルド.framework.js",

      codeUrl:
        buildUrl +
        "/ビルド.wasm",

      streamingAssetsUrl:
        "StreamingAssets",

      companyName:
        "DefaultCompany",

      productName:
        "運が全て。",

      productVersion:
        "1.0",

      showBanner:
        unityShowBanner

    };


    /* =========================
       ローディング要素
       ========================= */

    var loadingBar =
      document.querySelector(
        "#unity-loading-bar"
      );


    var progressBar =
      document.querySelector(
        "#unity-progress-bar-full"
      );


    var progressText =
      document.querySelector(
        "#unity-loading-percent"
      );


    loadingBar.style.display =
      "block";


    progressBar.style.width =
      "0%";


    progressText.textContent =
      "0%";


    /* =========================
       Unity Loader
       ========================= */

    var script =
      document.createElement(
        "script"
      );


    script.src =
      loaderUrl;


    script.onload =
      function () {


        console.log(
          "Unity Loader loaded"
        );


        createUnityInstance(

          canvas,

          config,


          function (
            progress
          ) {


            var percent =
              Math.round(
                progress * 100
              );


            console.log(
              "Unity loading:",
              percent + "%"
            );


            progressBar.style.width =
              percent + "%";


            progressText.textContent =
              percent + "%";


          }

        )


        .then(
          function (
            unityInstance
          ) {


            console.log(
              "Unity started"
            );


            progressBar.style.width =
              "100%";


            progressText.textContent =
              "100%";


            setTimeout(
              function () {


                loadingBar.style.display =
                  "none";


              },
              300
            );


            /* =====================
               フルスクリーン
               ===================== */

            document
              .querySelector(
                "#unity-fullscreen-button"
              )
              .onclick =
                function () {


                  unityInstance
                    .SetFullscreen(
                      1
                    );


                };


          }
        )


        .catch(
          function (
            message
          ) {


            console.error(
              "Unity error:",
              message
            );


            progressText.textContent =
              "読み込みエラー";


            alert(
              message
            );


          }
        );


      };


    /* =========================
       Loader読み込み失敗
       ========================= */

    script.onerror =
      function () {


        console.error(
          "Unity Loaderを読み込めませんでした。"
        );


        progressText.textContent =
          "Loader Error";


        alert(
          "Unity Loaderを読み込めませんでした。"
        );


      };


    /* =========================
       Unity起動
       ========================= */

    document.body.appendChild(
      script
    );


  </script>


</body>

</html>
